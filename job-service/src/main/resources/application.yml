server:
  port: 8082

spring:
  config:
    # API keys for job sources (${setting:key} in a source reads naukriradar.settings.key);
    # kept on this machine only, see config/job-sources-secrets.properties.example
    import: optional:file:./config/job-sources-secrets.properties
  application:
    name: job-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # fail fast: a cache or lock call must never hang a request
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      # jobs are also written and read with plain JDBC in UTC; keep Hibernate on the same clock
      hibernate.jdbc.time_zone: UTC

naukriradar:
  jobs:
    parsing:
      # AI reads this many unread jobs every 15 minutes (~770 a day): sized for a free Gemini key
      batch-size: 8
    allow-private-hosts: false
    # big company boards with full descriptions run to ~10MB (Databricks, Elastic)
    max-response-size: 12MB
    connect-timeout: 5s
    disable-after-failures: 5
    seed-defaults: true
    schedule:
      enabled: true
      # twice a day, morning and evening India time (so evening postings show up the same day);
      # a source with a small free quota asks for fewer runs (fetchEveryHours)
      fetch-cron: "0 0 9,21 * * *"
      zone: Asia/Kolkata
      cleanup-cron: "0 30 3 * * *"
      close-after-days: 7
      delete-after-days: 60

management:
  endpoints:
    web:
      exposure:
        include: health
