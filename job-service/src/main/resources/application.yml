server:
  port: 8082

spring:
  application:
    name: job-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # fail fast: a cache or lock call must never hang a request
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      # jobs are also written and read with plain JDBC in UTC; keep Hibernate on the same clock
      hibernate.jdbc.time_zone: UTC

naukriradar:
  jobs:
    allow-private-hosts: false
    max-response-size: 5MB
    connect-timeout: 5s
    disable-after-failures: 5
    seed-defaults: true
    schedule:
      enabled: true
      fetch-cron: "0 0 */6 * * *"
      cleanup-cron: "0 30 3 * * *"
      close-after-days: 7
      delete-after-days: 60

management:
  endpoints:
    web:
      exposure:
        include: health
