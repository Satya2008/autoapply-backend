spring:
  kafka:
    listener:
      # several test contexts live at once; only the event tests switch their consumers on
      auto-startup: false
  data:
    redis:
      # tests keep to their own Redis database
      database: 1
  datasource:
    # useAffectedRows: an UPDATE IGNORE that was skipped reports 0, not "1 row matched"
    url: jdbc:mysql://localhost:3306/naukriradar_job_test?useAffectedRows=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: create-drop

naukriradar:
  events:
    # tests never share topics or consumer groups with a development setup
    prefix: "test."
  jobs:
    # tests point sources at a local WireMock server
    allow-private-hosts: true
    disable-after-failures: 3
    schedule:
      enabled: false
    # only JobParsingIT turns this on, against a fake AI
    parsing:
      enabled: false
  settings:
    test-api-key: secret-123
