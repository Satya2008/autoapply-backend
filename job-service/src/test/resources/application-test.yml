spring:
  datasource:
    url: jdbc:mysql://localhost:3306/naukriradar_job_test
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: create-drop

naukriradar:
