server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/naukriradar_notify
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
  # any SMTP server; set these through the environment
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

naukriradar:
  notify:
    from-address: ${MAIL_FROM:NaukriRadar <no-reply@naukriradar.local>}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    core-api-url: ${CORE_API_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # SMTP being down is this service's normal bad day, not a reason to restart it
    mail:
      enabled: false
