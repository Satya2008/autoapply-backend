server:
  port: 8080

services:
  core-api: ${CORE_API_URL:http://localhost:8081}
  job-service: ${JOB_SERVICE_URL:http://localhost:8082}
  matching-service: ${MATCHING_SERVICE_URL:http://localhost:8083}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # before core-api: its /api/v1/me/** would otherwise take /api/v1/me/matches too
            - id: matching-service
              uri: ${services.matching-service}
              predicates:
                - Path=/api/v1/me/matches,/api/v1/me/matches/**,/api/v1/admin/prompts,/api/v1/admin/prompts/**,/api/v1/admin/ai/**
            - id: core-api
              uri: ${services.core-api}
              predicates:
                - Path=/api/v1/me/**,/api/v1/dev/**,/api/v1/admin/portals,/api/v1/admin/portals/**,/api/v1/admin/settings,/api/v1/admin/settings/**,/api/v1/admin/audit,/api/v1/admin/scheduler,/api/v1/admin/scheduler/**,/api/v1/admin/storage/**
            - id: job-service
              uri: ${services.job-service}
              predicates:
                - Path=/api/v1/admin/job-sources,/api/v1/admin/job-sources/**,/api/v1/admin/jobs/**,/api/v1/jobs,/api/v1/jobs/**
            # Each service's cache admin: /api/v1/admin/cache/<service>[/<cache>] reaches
            # /api/v1/admin/cache[/<cache>] on that service.
            - id: core-api-cache
              uri: ${services.core-api}
              predicates:
                - Path=/api/v1/admin/cache/core-api,/api/v1/admin/cache/core-api/**
              filters:
                - RewritePath=/api/v1/admin/cache/core-api(?<rest>.*), /api/v1/admin/cache$\{rest}
            - id: job-service-cache
              uri: ${services.job-service}
              predicates:
                - Path=/api/v1/admin/cache/job-service,/api/v1/admin/cache/job-service/**
              filters:
                - RewritePath=/api/v1/admin/cache/job-service(?<rest>.*), /api/v1/admin/cache$\{rest}
            - id: matching-service-cache
              uri: ${services.matching-service}
              predicates:
                - Path=/api/v1/admin/cache/matching-service,/api/v1/admin/cache/matching-service/**
              filters:
                - RewritePath=/api/v1/admin/cache/matching-service(?<rest>.*), /api/v1/admin/cache$\{rest}
            # Each service's events (dead letters, outbox): /api/v1/admin/events/<service>/...
            - id: core-api-events
              uri: ${services.core-api}
              predicates:
                - Path=/api/v1/admin/events/core-api/**
              filters:
                - RewritePath=/api/v1/admin/events/core-api(?<rest>.*), /api/v1/admin/events$\{rest}
            - id: job-service-events
              uri: ${services.job-service}
              predicates:
                - Path=/api/v1/admin/events/job-service/**
              filters:
                - RewritePath=/api/v1/admin/events/job-service(?<rest>.*), /api/v1/admin/events$\{rest}
            - id: matching-service-events
              uri: ${services.matching-service}
              predicates:
                - Path=/api/v1/admin/events/matching-service/**
              filters:
                - RewritePath=/api/v1/admin/events/matching-service(?<rest>.*), /api/v1/admin/events$\{rest}
            # Each service's dependency health: /api/v1/admin/resilience/<service>.
            - id: core-api-resilience
              uri: ${services.core-api}
              predicates:
                - Path=/api/v1/admin/resilience/core-api
              filters:
                - SetPath=/api/v1/admin/resilience
            - id: job-service-resilience
              uri: ${services.job-service}
              predicates:
                - Path=/api/v1/admin/resilience/job-service
              filters:
                - SetPath=/api/v1/admin/resilience
            - id: matching-service-resilience
              uri: ${services.matching-service}
              predicates:
                - Path=/api/v1/admin/resilience/matching-service
              filters:
                - SetPath=/api/v1/admin/resilience
            # Each service's OpenAPI document, so one Swagger UI here covers them all.
            - id: core-api-docs
              uri: ${services.core-api}
              predicates:
                - Path=/docs/core-api
              filters:
                - SetPath=/v3/api-docs
            - id: job-service-docs
              uri: ${services.job-service}
              predicates:
                - Path=/docs/job-service
              filters:
                - SetPath=/v3/api-docs
            - id: matching-service-docs
              uri: ${services.matching-service}
              predicates:
                - Path=/docs/matching-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: core-api
        url: /docs/core-api
      - name: job-service
        url: /docs/job-service
      - name: matching-service
        url: /docs/matching-service

naukriradar:
  rate-limit:
    # first match wins; requests no rule matches (docs, health) are not limited
    rules:
      # runs are expensive: a burst of 3, then one more every 10 minutes
      - name: runs
        paths: [/api/v1/me/matches/runs, /api/v1/me/applications/runs, /api/v1/admin/jobs/fetch-runs, "/api/v1/admin/job-sources/*/fetch", "/api/v1/admin/scheduler/*/run"]
        methods: [POST]
        capacity: 3
        refill-every: 10m
      - name: uploads
        paths: [/api/v1/me/resume]
        methods: [POST]
        capacity: 5
        refill-every: 1m
      - name: api
        paths: [/api/v1/**]
        capacity: 120
        refill-every: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health
