server:
  port: 8080

services:
  core-api: ${CORE_API_URL:http://localhost:8081}
  job-service: ${JOB_SERVICE_URL:http://localhost:8082}
  matching-service: ${MATCHING_SERVICE_URL:http://localhost:8083}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # before core-api: its /api/v1/me/** would otherwise take /api/v1/me/matches too
            - id: matching-service
              uri: ${services.matching-service}
              predicates:
                - Path=/api/v1/me/matches,/api/v1/me/matches/**
            - id: core-api
              uri: ${services.core-api}
              predicates:
                - Path=/api/v1/me/**,/api/v1/dev/**,/api/v1/admin/portals,/api/v1/admin/portals/**,/api/v1/admin/settings,/api/v1/admin/settings/**,/api/v1/admin/audit,/api/v1/admin/scheduler,/api/v1/admin/scheduler/**
            - id: job-service
              uri: ${services.job-service}
              predicates:
                - Path=/api/v1/admin/job-sources,/api/v1/admin/job-sources/**,/api/v1/admin/jobs/**,/api/v1/jobs,/api/v1/jobs/**
            # Each service's OpenAPI document, so one Swagger UI here covers them all.
            - id: core-api-docs
              uri: ${services.core-api}
              predicates:
                - Path=/docs/core-api
              filters:
                - SetPath=/v3/api-docs
            - id: job-service-docs
              uri: ${services.job-service}
              predicates:
                - Path=/docs/job-service
              filters:
                - SetPath=/v3/api-docs
            - id: matching-service-docs
              uri: ${services.matching-service}
              predicates:
                - Path=/docs/matching-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: core-api
        url: /docs/core-api
      - name: job-service
        url: /docs/job-service
      - name: matching-service
        url: /docs/matching-service

management:
  endpoints:
    web:
      exposure:
        include: health
