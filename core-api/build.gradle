plugins {
	id 'org.springframework.boot'
}

description = 'core-api: users, profiles, skills, resumes and applications'

dependencies {
	implementation project(':libs:common-web')
	implementation project(':libs:common-redis')
	implementation project(':libs:common-resilience')
	implementation project(':libs:common-events')
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	implementation platform('software.amazon.awssdk:bom:2.55.11')
	// the plain JDK HTTP client is enough; leave out the Apache and Netty ones the SDK pulls by default
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}
