spring:
  kafka:
    listener:
      # several test contexts live at once; only the event tests switch their consumers on
      auto-startup: false
  data:
    redis:
      # tests keep to their own Redis database
      database: 1
  datasource:
    url: jdbc:mysql://localhost:3306/naukriradar_core_test
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: create-drop

naukriradar:
  events:
    # tests never share topics or consumer groups with a development setup
    prefix: "test."
  storage:
    local-dir: build/test-files
  services:
    # ApplicationControllerIT runs WireMock on this port in place of matching-service. A fixed
    # port keeps one Spring context for every integration test.
    matching-service-url: http://localhost:18083
    # the same WireMock plays job-service (job descriptions for cover letters)
    job-service-url: http://localhost:18083
  security:
    encryption-key: qm/EECDO4DzcKUTPq4yhw2TNC1fGcjzfcFdyxJWoIZ8=
  scheduler:
    # cron jobs off in tests; they are triggered by hand where needed
    enabled: false
