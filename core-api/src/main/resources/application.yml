server:
  port: 8081
  tomcat:
    # Read the rest of an oversized upload so the client gets a clean 413, not a reset.
    max-swallow-size: 16MB

spring:
  application:
    name: core-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # fail fast: a cache or lock call must never hang a request
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      # A little above naukriradar.resume.max-size so our own check gives the clearer message.
      max-file-size: 11MB
      max-request-size: 12MB
      file-size-threshold: 1MB

naukriradar:
  storage:
    local-dir: ./data/files
  resume:
    max-size: 10MB
    max-pages: 20
    max-text-chars: 200000
  services:
    matching-service-url: ${MATCHING_SERVICE_URL:http://localhost:8083}
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8082}
    connect-timeout: 3s
    read-timeout: 15s
  applications:
    # SIMULATE records applications but never sends one. BROWSER arrives in Phase 15.
    mode: SIMULATE
    zone: Asia/Kolkata
    worker-threads: 2
    queue-capacity: 20
    # Risk lists, limits, retries and schedules are runtime settings: /api/v1/admin/settings
  security:
    # 32 random bytes, base64. Encrypts secret settings. No default on purpose: the service
    # refuses to start without it. Dev and test profiles set throwaway keys.
    encryption-key: ${NAUKRIRADAR_SECURITY_ENCRYPTION_KEY:}
  scheduler:
    # Turn the cron jobs off without touching their settings (tests do).
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
