server:
  port: 8081
  tomcat:
    # Read the rest of an oversized upload so the client gets a clean 413, not a reset.
    max-swallow-size: 16MB

spring:
  application:
    name: core-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      # A little above naukriradar.resume.max-size so our own check gives the clearer message.
      max-file-size: 11MB
      max-request-size: 12MB
      file-size-threshold: 1MB

naukriradar:
  storage:
    local-dir: ./data/files
  resume:
    max-size: 10MB
    max-pages: 20
    max-text-chars: 200000

management:
  endpoints:
    web:
      exposure:
        include: health
