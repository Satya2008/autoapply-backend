server:
  port: 8081
  tomcat:
    # Read the rest of an oversized upload so the client gets a clean 413, not a reset.
    max-swallow-size: 16MB

spring:
  application:
    name: core-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      # A little above naukriradar.resume.max-size so our own check gives the clearer message.
      max-file-size: 11MB
      max-request-size: 12MB
      file-size-threshold: 1MB

naukriradar:
  storage:
    local-dir: ./data/files
  resume:
    max-size: 10MB
    max-pages: 20
    max-text-chars: 200000
  services:
    matching-service-url: ${MATCHING_SERVICE_URL:http://localhost:8083}
    connect-timeout: 3s
    read-timeout: 15s
  applications:
    # SIMULATE records applications but never sends one. BROWSER arrives in Phase 15.
    mode: SIMULATE
    zone: Asia/Kolkata
    match-limit: 200
    max-needs-you-per-run: 50
    max-attempts: 3
    retry-delay: 30m
    worker-threads: 2
    queue-capacity: 20
    # Sites that ban automated applications. Applying there by bot can get the candidate's
    # account blocked, so these always wait for the candidate. Subdomains are included.
    high-risk-domains:
      - linkedin.com
      - naukri.com
      - indeed.com
      - glassdoor.com
      - monster.com
      - foundit.in
      - instahyre.com
      - shine.com
      - timesjobs.com
      - wellfound.com
      - myworkdayjobs.com
      - workday.com
      - taleo.net
      - icims.com
      - successfactors.com
    # Applicant tracking systems built for direct applications.
    low-risk-domains:
      - greenhouse.io
      - lever.co
      - workable.com
      - ashbyhq.com
      - recruitee.com
      - smartrecruiters.com
      - breezy.hr
      - teamtailor.com
      - personio.de

management:
  endpoints:
    web:
      exposure:
        include: health
