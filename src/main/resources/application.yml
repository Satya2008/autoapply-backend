server:
  port: 8080

spring:
  application:
    name: autoapply-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/autoapply
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

# JSearch API (RapidAPI)
jsearch:
  api:
    key: YOUR_JSEARCH_API_KEY
    base-url: https://jsearch.p.rapidapi.com
    host: jsearch.p.rapidapi.com

# Gemini API (Free AI)
gemini:
  api:
    key: YOUR_GEMINI_API_KEY
    base-url: https://generativelanguage.googleapis.com/v1beta

# JWT
jwt:
  secret: your_jwt_secret_key_minimum_256_bits
  expiration: 86400000  # 24 hours

# Job Fetch Schedule
job:
  fetch:
    cron: "0 0 */6 * * *"  # Every 6 hours
    queries:
      - "Java Developer in India"
      - "Spring Boot Developer in India"
      - "Backend Developer Java India"
