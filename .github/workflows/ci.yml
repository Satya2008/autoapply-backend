name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: naukriradar_core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # one test database per service; the container only creates the first
      - run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS naukriradar_job_test; CREATE DATABASE IF NOT EXISTS naukriradar_matching_test"
      # S3-compatible storage for the object storage tests (SeaweedFS, one binary, no container)
      - name: Start S3 (SeaweedFS)
        run: |
          curl -sSL https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz | tar xz
          mkdir -p /tmp/weed
          ./weed server -dir=/tmp/weed -s3 -s3.port=8333 -s3.config=scripts/seaweedfs-s3.json -volume.port=8380 -master.volumeSizeLimitMB=32 -volume.max=40 -ip=127.0.0.1 > /tmp/weed.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
      - name: Wait for Kafka
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break; sleep 1; done
      - run: ./gradlew build
