spring:
  kafka:
    listener:
      # several test contexts live at once; only the event tests switch their consumers on
      auto-startup: false
  data:
    redis:
      # tests keep to their own Redis database
      database: 1
  datasource:
    url: jdbc:mysql://localhost:3306/naukriradar_matching_test?useAffectedRows=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: create-drop

naukriradar:
  events:
    # tests never share topics or consumer groups with a development setup
    prefix: "test."
  security:
    encryption-key: 4bGq9vXo2LmT7yRk1PzWc8NdEh3UjAs5FiKt6QwYn0M=
  scheduling:
    enabled: false
  semantic:
    # job-service isn't running in tests; the tests that need the index fill it themselves
    index-on-startup: false
  ai:
    prices:
      model-a: { input: 1.00, output: 5.00 }
      model-b: { input: 0.15, output: 0.60 }
