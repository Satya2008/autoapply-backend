server:
  port: 8083

spring:
  application:
    name: matching-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # fail fast: a cache or lock call must never hang a request
      timeout: 2s
      connect-timeout: 2s
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      # matches are also written with plain JDBC in UTC; keep Hibernate on the same clock
      hibernate.jdbc.time_zone: UTC

naukriradar:
  services:
    core-api-url: ${CORE_API_URL:http://localhost:8081}
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8082}
    connect-timeout: 3s
    read-timeout: 15s
  matching:
    # Relative importance of each factor; they don't need to add up to 100.
    weights:
      skills: 35
      title: 25
      location: 15
      salary: 10
      experience: 10
      recency: 5
    min-store-score: 20
    candidate-limit: 300
    candidate-days: 60
    worker-threads: 2
    queue-capacity: 20

  # Providers are chosen at runtime: /api/v1/admin/ai/providers (add any provider with its
  # key and model, pick the primary, set the fallback order). The ones below are only added
  # on the very first start, with keys from environment variables if set.
  ai:
    enabled: true
    daily-budget-usd: 0.50
    seed-providers:
      anthropic:
        type: anthropic
        api-key: ${ANTHROPIC_API_KEY:}
        model: claude-haiku-4-5-20251001
      openai:
        type: openai
        api-key: ${OPENAI_API_KEY:}
        model: gpt-4o-mini
      gemini:
        type: gemini
        api-key: ${GEMINI_API_KEY:}
        model: gemini-2.0-flash
      ollama:
        type: ollama
        base-url: ${OLLAMA_URL:}
        model: llama3.2
    # USD per million tokens, for providers that don't set their own; check vendor prices
    prices:
      "[claude-haiku-4-5-20251001]": { input: 1.00, output: 5.00 }
      "[gpt-4o-mini]": { input: 0.15, output: 0.60 }
      "[gemini-2.0-flash]": { input: 0.10, output: 0.40 }
  security:
    # encrypts provider API keys at rest; 32 random bytes, base64
    encryption-key: ${NAUKRIRADAR_SECURITY_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
