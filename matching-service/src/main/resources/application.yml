server:
  port: 8083

spring:
  application:
    name: matching-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # fail fast: a cache or lock call must never hang a request
      timeout: 2s
      connect-timeout: 2s
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      # matches are also written with plain JDBC in UTC; keep Hibernate on the same clock
      hibernate.jdbc.time_zone: UTC

naukriradar:
  services:
    core-api-url: ${CORE_API_URL:http://localhost:8081}
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8082}
    connect-timeout: 3s
    read-timeout: 15s
  matching:
    # Relative importance of each factor; they don't need to add up to 100.
    weights:
      skills: 35
      title: 25
      location: 15
      salary: 10
      experience: 10
      recency: 5
    min-store-score: 20
    candidate-limit: 300
    candidate-days: 60
    worker-threads: 2
    queue-capacity: 20

  # A provider is used only when it has a key (Ollama needs none, just a running server).
  # Set the keys as environment variables; never commit them.
  ai:
    enabled: true
    daily-budget-usd: 0.50
    providers:
      anthropic:
        type: anthropic
        base-url: https://api.anthropic.com
        api-key: ${ANTHROPIC_API_KEY:}
      openai:
        type: openai
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:}
      gemini:
        type: gemini
        base-url: https://generativelanguage.googleapis.com
        api-key: ${GEMINI_API_KEY:}
      ollama:
        type: ollama
        base-url: ${OLLAMA_URL:}
        timeout: 120s
    # tried in order until one answers; a purpose not listed uses "default"
    routes:
      default:
        - anthropic:claude-haiku-4-5-20251001
        - openai:gpt-4o-mini
        - gemini:gemini-2.0-flash
        - ollama:llama3.2
    # USD per million tokens; check the vendors' current price lists
    prices:
      "[claude-haiku-4-5-20251001]": { input: 1.00, output: 5.00 }
      "[gpt-4o-mini]": { input: 0.15, output: 0.60 }
      "[gemini-2.0-flash]": { input: 0.10, output: 0.40 }
      "[llama3.2]": { input: 0, output: 0 }

management:
  endpoints:
    web:
      exposure:
        include: health
